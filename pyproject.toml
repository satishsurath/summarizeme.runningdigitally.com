[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "SIM", "UP", "RUF"]
ignore = []

[tool.ruff.format]
exclude = ["**/*.md"]

[tool.ruff.lint.isort]
known-first-party = ["app_config", "db", "summarizeme"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "auth: authentication tests",
]

[tool.pyright]
include = ["."]
exclude = [".venv", ".venv-*", "build", "dist", "coverage", "htmlcov", ".pytest_cache"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = "error"
reportMissingTypeStubs = "none"
