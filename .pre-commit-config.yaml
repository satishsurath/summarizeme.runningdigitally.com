# Pre-commit checks — run before every push
#
# Local: .venv/bin/pip install -r requirements-dev.txt && .venv/bin/pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-check
        name: Run pytest (unit)
        entry: .venv/bin/pytest tests/unit/ -q
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]
