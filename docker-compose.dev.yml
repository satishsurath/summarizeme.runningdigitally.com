services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: summarizeme
      POSTGRES_PASSWORD: summarizeme_pass
      POSTGRES_DB: summarizeme
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U summarizeme -d summarizeme"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # vLLM for embeddings (nomic-embed-text)
  vllm-embed:
    image: vllm/vllm-openai:latest
    ports:
      - "8001:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      - vllm_cache:/root/.cache/huggingface
    command: --model nomic-ai/nomic-embed-text-v1.5 --max-model-len 2048
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/models || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 120s

  # vLLM for generation (summarization, chat)
  vllm-gen:
    image: vllm/vllm-openai:latest
    ports:
      - "8000:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      - vllm_cache:/root/.cache/huggingface
    command: --model meta-llama/Llama-3.1-8B-Instruct --max-model-len 4096
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/models || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 120s

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://summarizeme:summarizeme_pass@db:5432/summarizeme
      VLLM_EMBED_HOST: vllm-embed
      VLLM_EMBED_PORT: "8000"
      VLLM_GEN_HOST: vllm-gen
      VLLM_GEN_PORT: "8000"
      REDIS_URL: redis://redis:6379/0
      FLASK_ENV: development
      DEV_AUTH_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      vllm-embed:
        condition: service_healthy
      vllm-gen:
        condition: service_healthy
    volumes:
      - .:/app
    command: flask run --host=0.0.0.0 --port=5000 --reload

volumes:
  postgres_data:
  vllm_cache:
