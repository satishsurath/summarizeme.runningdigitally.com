services:
  db:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: summarizeme
      POSTGRES_PASSWORD: summarizeme_pass
      POSTGRES_DB: summarizeme
    ports:
      - "55432:5432"
    volumes:
      - ./.data/postgres:/home/postgres/pgdata/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U summarizeme -d summarizeme"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # vLLM for embeddings (nomic-embed-text)

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5001:5000"
    environment:
      DATABASE_URL: postgresql://summarizeme:summarizeme_pass@db:5432/summarizeme
      VLLM_EMBED_HOST: <vllm-host>
      VLLM_EMBED_PORT: "8001"
      VLLM_GEN_HOST: <vllm-host>
      VLLM_GEN_PORT: "8000"
      REDIS_URL: redis://redis:6379/0
      FLASK_ENV: development
      DEV_AUTH_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: flask run --host=0.0.0.0 --port=5000 --reload

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: builder
      args:
        NEXT_API_URL: http://app:5000
        NEXT_PUBLIC_FLASK_URL: http://localhost:5001
    ports:
      - "3000:3000"
    environment:
      NEXT_API_URL: http://app:5000
      NEXT_PUBLIC_FLASK_URL: http://localhost:5001
    depends_on:
      - app
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    command: ["npx", "next", "dev", "-p", "3000", "-H", "0.0.0.0"]
