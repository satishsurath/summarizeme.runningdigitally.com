services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: summarizeme
      POSTGRES_PASSWORD: summarizeme_pass
      POSTGRES_DB: summarizeme
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U summarizeme -d summarizeme"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5001:5000"
    environment:
      DATABASE_URL: postgresql://summarizeme:summarizeme_pass@db:5432/summarizeme
      REDIS_URL: redis://redis:6379/0
      FLASK_ENV: development
      DEV_AUTH_ENABLED: "true"
      # Remote vLLM endpoints (production backend)
      # API keys are sourced from .env file — never commit literal values.
      VLLM_EMBED_API_KEY: ${VLLM_EMBED_API_KEY}
      VLLM_GEN_API_KEY: ${VLLM_GEN_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: flask run --host=0.0.0.0 --port=5000 --reload

volumes:
  postgres_data:
