# LEGACY — superseded by the docker-compose.prod.yml production stack.
# Auto-deploy on push is DISABLED: this only runs on manual dispatch, and it
# is retained for reference only. The deployment runbook
# (docs/deployment-runbook.md) is the current delivery path.
name: CI-CD

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:latest .
          docker push ghcr.io/${{ github.repository }}:latest

      - name: Deploy container
        run: |
          # Pull the newest image
          docker pull ghcr.io/${{ github.repository }}:latest
          # Stop old container (if running)
          docker stop summarizeme.runningdigitally.com || true
          docker rm summarizeme.runningdigitally.com || true
          # Run new container
          docker run -d --name summarizeme.runningdigitally.com \
            --restart always \
            --env-file=./.env \
            -p 8000:8000 \
            ghcr.io/${{ github.repository }}:latest