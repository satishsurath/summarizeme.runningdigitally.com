{% from 'macros.html' import render_icon %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="SummarizeMe - YouTube channel and video summarization" />
    <title>{{ title|default("YouTube Channel Summarizer") }}</title>
    
    <!-- Tailwind CSS CDN (dev) / compiled CSS (prod) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Design system: components, icons, config -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/icons.css') }}">
    
    <!-- Dark mode: set before paint to avoid flash -->
    <script>
        (function() {
            const stored = localStorage.getItem('darkMode');
            if (stored === 'true' || (stored !== 'false' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    
    <!-- Tailwind config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                    }
                }
            }
        }
    </script>
    <style>
        /* Dark mode toggle animations */
        .dark-mode-toggle {
            position: relative;
            width: 24px;
            height: 24px;
        }
        
        .dark-mode-toggle svg {
            position: absolute;
            top: 0;
            left: 0;
            transition: transform 500ms ease-in-out, opacity 250ms ease-in-out;
        }
        
        .dark-mode-toggle .sun {
            opacity: 0;
            transform: rotate(-90deg) scale(0);
        }
        
        .dark-mode-toggle .moon {
            opacity: 1;
            transform: rotate(0) scale(1);
        }
        
        .dark .dark-mode-toggle .sun {
            opacity: 1;
            transform: rotate(0) scale(1);
        }
        
        .dark .dark-mode-toggle .moon {
            opacity: 0;
            transform: rotate(90deg) scale(0);
        }
    </style>
</head>
<body class="bg-white dark:bg-gray-900 transition-colors duration-200">
    <!-- Skip navigation for accessibility -->
    <a href="#main-content" 
       class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 bg-primary-500 text-white px-4 py-2 rounded-lg z-50 transition-colors hover:bg-primary-600">
        Skip to main content
    </a>

    <header class="border-b border-gray-200 dark:border-gray-700">
        <nav class="container mx-auto px-4 py-4" aria-label="Main navigation">
            <div class="flex items-center justify-between">
                <!-- Brand -->
                <a href="{{ url_for('main.index') }}" class="text-2xl font-bold text-gray-800 dark:text-white hover:text-primary">
                    SummarizeMe
                </a>
                
                <!-- Desktop nav links -->
                <div class="hidden md:flex items-center space-x-1">
                    <a href="{{ url_for('main.index') }}" 
                       class="nav-link {% if request.endpoint == 'main.index' %}active{% endif %}">
                        Channels
                    </a>
                    <a href="{{ url_for('admin.admin_settings') }}" 
                       class="nav-link {% if request.endpoint == 'admin.admin_settings' %}active{% endif %}">
                        Admin
                    </a>
                </div>

                <!-- Right side: notifications + dark mode + mobile menu -->
                <div class="flex items-center space-x-2">
                    <!-- Notifications dropdown -->
                    <div class="relative">
                        <button id="notificationBtn" 
                                class="icon-btn relative"
                                aria-label="Notifications"
                                aria-expanded="false"
                                aria-controls="notificationDropdown">
                            {{ render_icon('bell', 'md') }}
                            <span id="notificationBadge" class="hidden absolute -top-1 -right-1 w-4 h-4 bg-primary-500 rounded-full text-xs text-white flex items-center justify-center"></span>
                        </button>
                        <!-- Notification Dropdown -->
                        <div id="notificationDropdown" 
                             class="hidden absolute right-0 mt-2 w-80 bg-white dark:bg-gray-800 rounded-lg shadow-lg border border-gray-200 dark:border-gray-700 z-50"
                             role="menu">
                            <div class="px-4 py-3 border-b border-gray-200 dark:border-gray-700">
                                <h3 class="text-sm font-semibold text-gray-900 dark:text-white">Active Tasks</h3>
                            </div>
                            <div id="notificationList" class="max-h-64 overflow-y-auto">
                                <div class="px-4 py-6 text-center text-gray-500 dark:text-gray-400 text-sm">
                                    Loading...
                                </div>
                            </div>
                            <div class="px-4 py-2 border-t border-gray-200 dark:border-gray-700">
                                <a href="{{ url_for('main.status_page') }}" 
                                   class="text-sm text-primary-500 hover:text-primary-600 block"
                                   role="menuitem">
                                    View All Tasks →
                                </a>
                            </div>
                        </div>
                    </div>

                    <!-- Dark mode toggle for desktop -->
                    <button id="darkModeToggle" 
                            class="icon-btn"
                            aria-label="Toggle dark mode">
                        <div class="dark-mode-toggle">
                            {{ render_icon('sun', 'lg', extra_class='sun') }}
                            {{ render_icon('moon', 'lg', extra_class='moon') }}
                        </div>
                    </button>
                    
                    <!-- Mobile menu button -->
                    <button id="mobile-menu-button" 
                            class="icon-btn md:hidden"
                            aria-label="Open navigation menu"
                            aria-expanded="false"
                            aria-controls="mobile-menu">
                        {{ render_icon('menu', 'lg', extra_class='text-gray-600 dark:text-gray-300') }}
                    </button>
                </div>
            </div>

            <!-- Mobile menu -->
            <div id="mobile-menu" 
                 class="hidden md:hidden mt-4 space-y-2"
                 role="menu">
                <a href="{{ url_for('main.index') }}" 
                   class="block px-3 py-2 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700"
                   role="menuitem">Channels</a>
                <a href="{{ url_for('main.status_page') }}" 
                   class="block px-3 py-2 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700"
                   role="menuitem">Status</a>
                <a href="{{ url_for('admin.admin_settings') }}" 
                   class="block px-3 py-2 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700"
                   role="menuitem">Admin</a>
                <button id="darkModeToggleMobile" 
                        class="w-full text-left px-3 py-2 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-2"
                        aria-label="Toggle dark mode">
                    <div class="dark-mode-toggle">
                        {{ render_icon('sun', 'md', extra_class='sun') }}
                        {{ render_icon('moon', 'md', extra_class='moon') }}
                    </div>
                    <span>Dark mode</span>
                </button>
            </div>
        </nav>
    </header>

    <!-- Main content area -->
    <main id="main-content" class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Live region for screen reader announcements -->
    <div id="liveRegion" aria-live="polite" aria-atomic="true" class="sr-only"></div>

    <!-- Script order: dependencies first, then page-specific -->
    <script src="{{ url_for('static', filename='js/toast.js') }}"></script>
    <script src="{{ url_for('static', filename='js/loading.js') }}"></script>
    <script src="{{ url_for('static', filename='js/index.js') }}"></script>
    <script src="{{ url_for('static', filename='js/notifications.js') }}"></script>
    <script src="{{ url_for('static', filename='js/icons.js') }}"></script>
    <script src="{{ url_for('static', filename='js/thumbnails.js') }}"></script>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
    {% block scripts %}{% endblock %}

    <!-- Dark mode toggle and mobile menu logic -->
    <script>
        // Mobile menu toggle
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');
        
        if (mobileMenuButton && mobileMenu) {
            mobileMenuButton.addEventListener('click', () => {
                const isOpen = !mobileMenu.classList.contains('hidden');
                mobileMenu.classList.toggle('hidden');
                mobileMenuButton.setAttribute('aria-expanded', !isOpen);
                mobileMenuButton.setAttribute('aria-label', isOpen ? 'Open navigation menu' : 'Close navigation menu');
            });

            // Close mobile menu on Escape
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !mobileMenu.classList.contains('hidden')) {
                    mobileMenu.classList.add('hidden');
                    mobileMenuButton.setAttribute('aria-expanded', 'false');
                    mobileMenuButton.focus();
                }
            });
        }

        // Dark mode toggle function
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('darkMode', isDark);
        }

        // Add click handlers to both desktop and mobile dark mode toggles
        const darkModeToggleDesktop = document.getElementById('darkModeToggle');
        const darkModeToggleMobile = document.getElementById('darkModeToggleMobile');
        if (darkModeToggleDesktop) darkModeToggleDesktop.addEventListener('click', toggleDarkMode);
        if (darkModeToggleMobile) darkModeToggleMobile.addEventListener('click', toggleDarkMode);
    </script>
    <svg style="display:none">
      <defs>
      <symbol id="icon-summarizeYouTube"  viewBox="0 0 48 48">
        <linearGradient id="PgB_UHa29h0TpFV_moJI9a" x1="9.816" x2="41.246" y1="9.871" y2="41.301" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#f44f5a"/><stop offset=".443" stop-color="#ee3d4a"/>
                <stop offset="1" stop-color="#e52030"/>
        </linearGradient>
        <path fill="url(#PgB_UHa29h0TpFV_moJI9a)" d="M45.012,34.56c-0.439,2.24-2.304,3.947-4.608,4.267C36.783,39.36,30.748,40,23.945,40	c-6.693,0-12.728-0.64-16.459-1.173c-2.304-0.32-4.17-2.027-4.608-4.267C2.439,32.107,2,28.48,2,24s0.439-8.107,0.878-10.56	c0.439-2.24,2.304-3.947,4.608-4.267C11.107,8.64,17.142,8,23.945,8s12.728,0.64,16.459,1.173c2.304,0.32,4.17,2.027,4.608,4.267	C45.451,15.893,46,19.52,46,24C45.89,28.48,45.451,32.107,45.012,34.56z"/><path d="M32.352,22.44l-11.436-7.624c-0.577-0.385-1.314-0.421-1.925-0.093C18.38,15.05,18,15.683,18,16.376	v15.248c0,0.693,0.38,1.327,0.991,1.654c0.278,0.149,0.581,0.222,0.884,0.222c0.364,0,0.726-0.106,1.04-0.315l11.436-7.624	c0.523-0.349,0.835-0.932,0.835-1.56C33.187,23.372,32.874,22.789,32.352,22.44z" opacity=".07"/>
        <path d="M20.681,15.237l10.79,7.194c0.689,0.495,1.153,0.938,1.153,1.513c0,0.575-0.224,0.976-0.715,1.334	c-0.371,0.27-11.045,7.364-11.045,7.364c-0.901,0.604-2.364,0.476-2.364-1.499V16.744C18.5,14.739,20.084,14.839,20.681,15.237z" opacity=".07"/>
        <path fill="#fff" d="M19,31.568V16.433c0-0.743,0.828-1.187,1.447-0.774l11.352,7.568c0.553,0.368,0.553,1.18,0,1.549	l-11.352,7.568C19.828,32.755,19,32.312,19,31.568z"/>
      </symbol>
      </defs>
    </svg>
</body>
</html>
